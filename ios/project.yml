name: Bubu
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs.git
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9
targets:
  Bubu:
    type: application
    platform: iOS
    sources: [Bubu]
    dependencies:
      - package: FSRS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.spinny.bubu
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bùbù
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: La voce resta sul dispositivo e serve per esercitare pronuncia e orale.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  BubuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BubuTests]
    dependencies:
      - target: Bubu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.spinny.bubu.tests
        GENERATE_INFOPLIST_FILE: YES
  BubuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BubuUITests]
    dependencies:
      - target: Bubu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.spinny.bubu.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bubu:
    build:
      targets:
        Bubu: all
    test:
      targets: [BubuTests, BubuUITests]
